<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>السيارات الجديدة - أهل كار</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.8/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { darkBg: '#0b0f19', cardBg: '#111827', accentGold: '#f59e0b' } } } }
    </script>
</head>
<body class="bg-darkBg text-white font-sans antialiased min-h-screen">
    <header class="bg-cardBg border-b border-gray-800 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-accentGold"><i class="fa-solid fa-car-side ml-2"></i>أهل كار</a>
            <nav class="hidden md:flex space-x-6 space-x-reverse text-gray-300">
                <a href="index.html" class="hover:text-accentGold">الرئيسية</a>
                <a href="new-cars.html" class="text-accentGold font-bold">السيارات الجديدة</a>
                <a href="used-cars.html" class="hover:text-accentGold">السيارات المستعملة</a>
            </nav>
        </div>
    </header>

    <div class="container mx-auto px-4 py-12">
        <h1 class="text-3xl font-bold text-accentGold mb-8 text-center">السيارات الجديدة المتاحة</h1>
        <div id="new-cars-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="text-center text-gray-400 py-12 col-span-full">جاري التحميل...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        const db = getFirestore(initializeApp({ apiKey: "AIzaSyDummyKey", authDomain: "ahl-car-showroom-db.firebaseapp.com", projectId: "ahl-car-showroom-db" }));
        
        async function loadNew() {
            const grid = document.getElementById('new-cars-grid');
            const snap = await getDocs(collection(db, "cars"));
            let html = '';
            snap.forEach(d => {
                const c = d.data();
                if (!c.type || c.type === 'new') {
                    html += `
                        <div class="bg-cardBg rounded-2xl overflow-hidden border border-gray-800 shadow-xl">
                            <img src="${c.image}" class="w-full h-52 object-cover">
                            <div class="p-5">
                                <h3 class="text-xl font-bold mb-2">${c.name}</h3>
                                <p class="text-gray-400 text-sm mb-4">${c.description}</p>
                                <div class="flex justify-between items-center">
                                    <span class="text-accentGold font-bold text-lg">${c.price} ريال</span>
                                    <a href="https://wa.me/?text=${encodeURIComponent('أرغب بالاستفسار عن سيارة جديدة: ' + c.name)}" target="_blank" class="bg-accentGold text-darkBg px-4 py-2 rounded-xl font-bold text-sm">استفسار</a>
                                </div>
                            </div>
                        </div>`;
                }
            });
            grid.innerHTML = html || '<div class="text-center text-gray-400 col-span-full py-12">لا توجد سيارات جديدة مضافة حالياً.</div>';
        }
        loadNew();
    </script>
</body>
</html>
