<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>السيارات الجديدة - أهل كار</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.8/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { darkBg: '#0b0f19', cardBg: '#111827', accentGold: '#f59e0b' } } } }
    </script>
</head>
<body class="bg-darkBg text-white font-sans antialiased min-h-screen flex flex-col justify-between">
    <header class="bg-cardBg border-b border-gray-800 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <!-- زر سهم الرجوع للصفحة الرئيسية -->
                <a href="index.html" class="bg-darkBg hover:bg-gray-800 text-accentGold border border-gray-700 w-10 h-10 rounded-xl flex items-center justify-center transition shadow" title="الرجوع للصفحة الرئيسية">
                    <i class="fa-solid fa-arrow-right text-lg"></i>
                </a>
                <a href="index.html" class="text-2xl font-bold text-accentGold flex items-center gap-2"><i class="fa-solid fa-car-side"></i>أهل كار</a>
            </div>
            <nav class="hidden md:flex space-x-6 space-x-reverse text-gray-300 font-medium">
                <a href="index.html" class="hover:text-accentGold transition">الرئيسية</a>
                <a href="new-cars.html" class="text-accentGold font-bold">السيارات الجديدة</a>
                <a href="used-cars.html" class="hover:text-accentGold transition">السيارات المستعملة</a>
            </nav>
        </div>
    </header>

    <main class="container mx-auto px-2 md:px-4 py-12 flex-1">
        <div class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4 px-2">
            <h1 class="text-2xl md:text-3xl font-extrabold text-accentGold flex items-center gap-2">
                <i class="fa-solid fa-car-burst"></i>السيارات الجديدة المتاحة
            </h1>
            <span id="cars-count" class="bg-cardBg text-gray-300 text-xs md:text-sm px-3 py-1 rounded-full border border-gray-800">جاري التحديث...</span>
        </div>
        <!-- ضبط الشبكة لتصبح إعلانين بجانب بعضهما على الموبايل و3 على الكمبيوتر -->
        <div id="new-cars-grid" class="grid grid-cols-2 lg:grid-cols-3 gap-3 md:gap-8">
            <div class="text-center text-gray-400 py-16 col-span-full">
                <i class="fa-solid fa-spinner fa-spin text-accentGold text-3xl mb-3"></i>
                <p>جاري تحميل السيارات الجديدة من السحابة...</p>
            </div>
        </div>
    </main>

    <!-- نافذة مكبرة لعرض الصورة بالكامل مع زر إغلاق (X) واضح للرجوع للإعلان -->
    <div id="imageModal" class="fixed inset-0 bg-black/95 z-50 hidden flex items-center justify-center p-2">
        <button onclick="closeImageModal()" class="absolute top-4 left-4 z-50 text-darkBg bg-accentGold w-12 h-12 rounded-full flex items-center justify-center text-2xl font-bold shadow-2xl hover:scale-110 transition border-2 border-white" title="إغلاق والرجوع للإعلان">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="relative w-full h-full flex items-center justify-center p-2" onclick="closeImageModal()">
            <img id="modalImg" src="" alt="صورة مكبرة" class="max-w-full max-h-[90vh] object-contain rounded-xl shadow-2xl border border-gray-700" onclick="event.stopPropagation()">
        </div>
    </div>

    <footer class="bg-cardBg border-t border-gray-800 py-8 text-center text-gray-400 text-xs md:text-sm">
        <div class="container mx-auto px-4 space-y-2">
            <p class="text-gray-200 font-bold text-base">مجموعة معارض أهل كار للسيارات الفاخرة</p>
            <p><i class="fa-brands fa-whatsapp text-green-500 ml-1"></i> للتواصل واتساب: <a href="https://wa.me/966573634794" target="_blank" class="text-accentGold font-bold hover:underline">0573634794</a></p>
            <p class="text-gray-500">جميع حقوق الطبع والنشر محفوظة © 2026</p>
        </div>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyAhvlqVZD9S9EwQJM3HGaN2W9es2EOtA-Q",
            authDomain: "ahl-car-showroom-db.firebaseapp.com",
            projectId: "ahl-car-showroom-db",
            storageBucket: "ahl-car-showroom-db.firebasestorage.app",
            messagingSenderId: "381597747239",
            appId: "1:381597747239:web:5db9d994dc0f8de9ec2602",
            measurementId: "G-5Q5WSL36YH"
        };

        const db = getFirestore(initializeApp(firebaseConfig));
        
        window.currentImageIndexes = {};
        window.carsDataStore = {};

        async function loadNewCars() {
            const grid = document.getElementById('new-cars-grid');
            const countBadge = document.getElementById('cars-count');
            
            try {
                const querySnapshot = await getDocs(collection(db, "cars"));
                const cars = [];
                
                querySnapshot.forEach(docSnap => {
                    const c = docSnap.data();
                    c.firestoreId = docSnap.id;
                    if (!c.type || c.type === 'new') {
                        cars.push(c);
                    }
                });

                // ترتيب السيارات لتظهر الإعلانات المضافة حديثاً في المقدمة
                cars.sort((a, b) => {
                    const timeA = a.createdAt ? new Date(a.createdAt).getTime() : 0;
                    const timeB = b.createdAt ? new Date(b.createdAt).getTime() : 0;
                    return timeB - timeA;
                });

                countBadge.innerText = `${cars.length} سيارات متوفرة`;
                grid.innerHTML = '';

                if (cars.length === 0) {
                    grid.innerHTML = '<div class="text-center text-gray-400 col-span-full py-16 bg-cardBg rounded-2xl border border-gray-800"><p class="text-lg">لا توجد سيارات جديدة مضافة حالياً في السحابة.</p></div>';
                    return;
                }

                cars.forEach(car => {
                    const carKey = car.firestoreId;
                    window.carsDataStore[carKey] = car;
                    if (window.currentImageIndexes[carKey] === undefined) {
                        window.currentImageIndexes[carKey] = 0;
                    }

                    let imagesArray = [];
                    if (Array.isArray(car.images) && car.images.length > 0) {
                        imagesArray = car.images;
                    } else if (car.image) {
                        imagesArray = [car.image];
                    } else {
                        imagesArray = ['https://via.placeholder.com/600x400'];
                    }

                    const imgIdx = window.currentImageIndexes[carKey];
                    const currentImg = imagesArray[imgIdx] || imagesArray[0];
                    const carName = car.name || 'سيارة جديدة';
                    const carPrice = car.price ? car.price + ' ريال' : 'السعر عند الطلب';
                    const whatsappMsg = encodeURIComponent(`مرحباً، أرغب بالاستفسار عن السيارة الجديدة: ${carName} بسعر ${carPrice}`);

                    grid.innerHTML += `
                        <div class="bg-cardBg rounded-xl md:rounded-2xl overflow-hidden border border-gray-800 shadow-xl flex flex-col justify-between group hover:border-accentGold/50 transition">
                            <div class="relative h-40 sm:h-52 md:h-60 bg-black flex items-center justify-center overflow-hidden cursor-pointer" onclick="openImageModal('${currentImg}')">
                                <img src="${currentImg}" alt="${carName}" class="w-full h-full object-contain transition duration-300 group-hover:scale-105" title="اضغط لتكبير الصورة">
                                ${imagesArray.length > 1 ? `
                                    <button onclick="event.stopPropagation(); changeImage('${carKey}', -1)" class="absolute right-1.5 top-1/2 -translate-y-1/2 bg-black/70 hover:bg-black text-white w-7 h-7 md:w-9 md:h-9 rounded-full flex items-center justify-center transition shadow z-10" title="الصورة السابقة">
                                        <i class="fa-solid fa-chevron-right text-[10px] md:text-xs"></i>
                                    </button>
                                    <button onclick="event.stopPropagation(); changeImage('${carKey}', 1)" class="absolute left-1.5 top-1/2 -translate-y-1/2 bg-black/70 hover:bg-black text-white w-7 h-7 md:w-9 md:h-9 rounded-full flex items-center justify-center transition shadow z-10" title="الصورة التالية">
                                        <i class="fa-solid fa-chevron-left text-[10px] md:text-xs"></i>
                                    </button>
                                    <span class="absolute bottom-1.5 left-1.5 bg-black/80 text-[10px] md:text-xs px-2 py-0.5 rounded-md text-accentGold font-bold z-10">
                                        ${imgIdx + 1} /${imagesArray.length}
                                    </span>
                                ` : ''}
                                <div class="absolute top-2 right-2 bg-darkBg/90 backdrop-blur-md text-accentGold px-2.5 py-1 rounded-full text-[11px] md:text-xs font-bold border border-gray-700 shadow z-10">
                                    ${carPrice}
                                </div>
                                <div class="absolute top-2 left-2 bg-accentGold text-darkBg px-2 py-0.5 rounded text-[10px] md:text-xs font-extrabold shadow z-10">
                                    جديد
                                </div>
                            </div>
                            <div class="p-3 md:p-6 flex-1 flex flex-col justify-between space-y-3">
                                <div>
                                    <h3 class="text-base md:text-xl font-bold mb-1 text-white line-clamp-1">${carName}</h3>
                                    <p class="text-gray-400 text-xs md:text-sm mb-3 line-clamp-2 leading-relaxed">${car.description || car.desc || 'لا توجد تفاصيل إضافية متاحة.'}</p>
                                </div>
                                <div>
                                    <a href="https://wa.me/966573634794?text=${whatsappMsg}" target="_blank" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-2 md:py-2.5 rounded-xl transition duration-300 text-center text-xs md:text-sm flex items-center justify-center gap-1.5 shadow">
                                        <i class="fa-brands fa-whatsapp text-sm md:text-base"></i> استفسر عبر واتساب
                                    </a>
                                </div>
                            </div>
                        </div>`;
                });
            } catch (err) {
                console.error(err);
                grid.innerHTML = '<div class="text-center text-red-400 col-span-full py-12">حدث خطأ أثناء تحميل السيارات الجديدة من السحابة.</div>';
            }
        }

        window.changeImage = function(carKey, direction) {
            const car = window.carsDataStore[carKey];
            if (!car) return;
            let imagesArray = [];
            if (Array.isArray(car.images) && car.images.length > 0) imagesArray = car.images;
            else if (car.image) imagesArray = [car.image];
            else imagesArray = ['https://via.placeholder.com/600x400'];

            if (imagesArray.length > 1) {
                let current = window.currentImageIndexes[carKey] || 0;
                current += direction;
                if (current < 0) current = imagesArray.length - 1;
                if (current >= imagesArray.length) current = 0;
                window.currentImageIndexes[carKey] = current;
                loadNewCars();
            }
        }

        window.openImageModal = function(imgSrc) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            modalImg.src = imgSrc;
            modal.classList.remove('hidden');
        }

        window.closeImageModal = function() {
            const modal = document.getElementById('imageModal');
            modal.classList.add('hidden');
        }

        loadNewCars();
    </script>
</body>
</html>
