<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الشاملة - أهل كار</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.8/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#111827',
                        accentGold: '#f59e0b'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-white font-sans antialiased min-h-screen">

    <!-- Header -->
    <header class="bg-cardBg border-b border-gray-800 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <span class="text-2xl font-bold text-accentGold flex items-center gap-2">
                    <i class="fa-solid fa-gauge-high"></i>لوحة تحكم المعرض
                </span>
            </div>
            <a href="index.html" target="_blank" class="bg-gray-800 hover:bg-gray-700 text-gray-200 px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
                <i class="fa-solid fa-globe"></i>عرض الموقع الرئيسي
            </a>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-6xl space-y-12">

        <!-- قسم إضافة سيارة جديدة مع رفع الصور من الجهاز -->
        <section class="bg-cardBg border border-gray-800 rounded-2xl p-6 md:p-8 shadow-xl">
            <h2 class="text-2xl font-bold text-accentGold mb-6 flex items-center gap-2">
                <i class="fa-solid fa-circle-plus"></i>إضافة سيارة أو إعلان جديد للمعرض
            </h2>
            <form id="addCarForm" onsubmit="addNewCar(event)" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-gray-300 text-sm mb-2">عنوان السيارة / الموديل</label>
                        <input type="text" id="carName" required class="w-full bg-darkBg border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-accentGold" placeholder="مثال: تويوتا كامري 2026 فل كامل">
                    </div>
                    <div>
                        <label class="block text-gray-300 text-sm mb-2">السعر (بالريال)</label>
                        <input type="text" id="carPrice" required class="w-full bg-darkBg border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-accentGold" placeholder="مثال: 95000">
                    </div>
                </div>
                <div>
                    <label class="block text-gray-300 text-sm mb-2">رفع صورة السيارة (من الموبيل أو اللاب توب)</label>
                    <input type="file" id="carImageFile" accept="image/*" required class="w-full bg-darkBg border border-gray-700 rounded-xl px-4 py-3 text-gray-300 file:ml-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-accentGold file:text-darkBg file:font-bold hover:file:opacity-90 cursor-pointer">
                </div>
                <div>
                    <label class="block text-gray-300 text-sm mb-2">تفاصيل ومواصفات السيارة</label>
                    <textarea id="carDesc" rows="3" required class="w-full bg-darkBg border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-accentGold" placeholder="اكتب المواصفات، الممشى، اللون، أو أي تفاصيل أخرى..."></textarea>
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-accentGold text-darkBg font-bold py-3.5 rounded-xl hover:opacity-90 transition shadow-lg text-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up"></i>نشر السيارة وإضافتها فوراً للمعرض
                </button>
            </form>
        </section>

        <!-- قسم إدارة الطلبات واستفسارات الزبائن -->
        <section class="bg-cardBg border border-gray-800 rounded-2xl p-6 md:p-8 shadow-xl">
            <h2 class="text-2xl font-bold text-accentGold mb-6 flex items-center gap-2">
                <i class="fa-solid fa-list-check"></i>طلبات الشراء والاستفسارات الواردة من الموقع
            </h2>
            <div id="orders-container" class="space-y-4">
                <div class="text-center text-gray-400 py-8">جاري تحميل الطلبات الواردة...</div>
            </div>
        </section>

    </main>

    <!-- Firebase & Script Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForShowroom...",
            authDomain: "ahl-car-showroom-db.firebaseapp.com",
            projectId: "ahl-car-showroom-db",
            storageBucket: "ahl-car-showroom-db.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123:web:abc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // تحويل صورة الجهاز إلى Base64 لرفعها وحفظها بسهولة دون الحاجة لخدمات تخزين خارجية معقدة
        const convertImageToBase64 = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = (error) => reject(error);
            });
        };

        window.addNewCar = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin ml-2"></i>جاري الرفع والنشر...';

            const name = document.getElementById('carName').value;
            const price = document.getElementById('carPrice').value;
            const description = document.getElementById('carDesc').value;
            const fileInput = document.getElementById('carImageFile').files[0];

            try {
                let base64Image = '';
                if (fileInput) {
                    base64Image = await convertImageToBase64(fileInput);
                }

                await addDoc(collection(db, "cars"), {
                    name,
                    price,
                    description,
                    image: base64Image,
                    createdAt: new Date().toISOString()
                });

                alert('تمت إضافة السيارة ونشرها في الموقع فوراً بنجاح!');
                document.getElementById('addCarForm').reset();
            } catch (err) {
                console.error(err);
                alert('حدث خطأ أثناء رفع السيارة، تأكد من حجم الصورة.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i>نشر السيارة وإضافتها فوراً للمعرض';
            }
        }

        async function loadOrders() {
            const container = document.getElementById('orders-container');
            try {
                const snapshot = await getDocs(collection(db, "orders"));
                if (snapshot.empty) {
                    container.innerHTML = '<div class="text-center text-gray-400 py-8 bg-darkBg/50 rounded-xl border border-gray-800">لا توجد طلبات شراء أو استفسارات حتى الآن.</div>';
                    return;
                }

                let html = '';
                snapshot.forEach((docSnap) => {
                    const order = docSnap.data();
                    const orderId = docSnap.id;
                    const whatsappMsg = encodeURIComponent(`مرحباً أ/${order.name}، بخصوص طلبك لشراء السيارة (${order.carName}) في معرض أهل كار، نحن جاهزون لخدمتك وتأكيد التفاصيل.`);

                    html += `
                        <div class="bg-darkBg border border-gray-800 rounded-xl p-5 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 hover:border-gray-700 transition">
                            <div class="space-y-1">
                                <div class="flex items-center gap-3">
                                    <span class="text-accentGold font-bold text-lg">${order.carName || 'سيارة'}</span>
                                    <span class="bg-accentGold/20 text-accentGold text-xs px-2.5 py-1 rounded-full font-semibold">طلب جديد</span>
                                </div>
                                <p class="text-white text-sm"><strong class="text-gray-400">العميل:</strong> ${order.name}</p>
                                <p class="text-white text-sm"><strong class="text-gray-400">الجوال:</strong> ${order.phone}</p>
                                <p class="text-gray-300 text-sm bg-cardBg p-3 rounded-lg mt-2 border border-gray-800"><strong>ملاحظات العميل:</strong> ${order.notes || 'لا توجد ملاحظات'}</p>
                            </div>
                            <div class="flex items-center gap-3 w-full md:w-auto justify-end">
                                <a href="https://wa.me/${order.phone}?text=${whatsappMsg}" target="_blank" class="bg-green-600 hover:bg-green-500 text-white px-4 py-2.5 rounded-xl text-sm font-bold transition flex items-center gap-2 shadow">
                                    <i class="fa-brands fa-whatsapp text-lg"></i>مراسلة عبر واتساب
                                </a>
                                <button onclick="deleteOrder('${orderId}')" class="bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white px-3 py-2.5 rounded-xl text-sm transition border border-red-800/50" title="حذف الطلب">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (error) {
                console.error(error);
                container.innerHTML = '<div class="text-center text-red-400 py-6">حدث خطأ أثناء تحميل الطلبات.</div>';
            }
        }

        window.deleteOrder = async function(id) {
            if (confirm('هل أنت متأكد من حذف هذا الطلب؟')) {
                try {
                    await deleteDoc(doc(db, "orders", id));
                    alert('تم حذف الطلب بنجاح.');
                    loadOrders();
                } catch (e) {
                    console.error(e);
                    alert('فشل في حذف الطلب.');
                }
            }
        }

        loadOrders();
    </script>
</body>
</html>
