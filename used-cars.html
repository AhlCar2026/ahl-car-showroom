<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العربيات المستعملة - مجموعة معارض أهل كار</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#111827',
                        accentGold: '#f59e0b'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-white font-sans antialiased min-h-screen flex flex-col justify-between">

    <header class="bg-cardBg border-b border-slate-800 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-accentGold">مجموعة معارض أهل كار</h1>
            <nav class="space-x-6 space-x-reverse hidden md:flex font-medium">
                <a href="index.html" class="hover:text-accentGold transition">الرئيسية</a>
                <a href="new-cars.html" class="hover:text-accentGold transition">عربيات جديدة</a>
                <a href="used-cars.html" class="text-accentGold transition">عربيات مستعملة</a>
                <a href="admin.html" class="text-slate-400 hover:text-white transition text-sm border border-slate-700 px-3 py-1 rounded">لوحة التحكم</a>
            </nav>
        </div>
    </header>

    <main class="container mx-auto px-4 py-10 flex-1">
        <div class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <h2 class="text-3xl font-extrabold text-accentGold flex items-center gap-2">
                <i class="fa-solid fa-rotate-left"></i> العربيات المستعملة (السحابية)
            </h2>
            <span id="cars-count" class="bg-slate-800 text-slate-300 text-sm px-3 py-1 rounded-full border border-slate-700">جاري التحديث...</span>
        </div>

        <div id="cars-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- حالة التحميل -->
            <div class="col-span-full text-center py-16 text-slate-400">
                <i class="fa-solid fa-spinner fa-spin text-amber-500 text-3xl mb-3"></i>
                <p>جاري تحميل العربيات المستعملة من السحابة...</p>
            </div>
        </div>
    </main>

    <footer class="bg-cardBg border-t border-slate-800 py-6 text-center text-slate-500 text-sm">
        <p>جميع الحقوق محفوظة © 2026 - مجموعة معارض أهل كار</p>
    </footer>

    <!-- سكربت جلب وعرض السيارات المستعملة من Firestore -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // مفاتيح الربط السحابية الخاصة بمشروعك
        const firebaseConfig = {
            apiKey: "AIzaSyAhvlqVZD9S9EwQJM3HGaN2W9es2EOtA-Q",
            authDomain: "ahl-car-showroom-db.firebaseapp.com",
            projectId: "ahl-car-showroom-db",
            storageBucket: "ahl-car-showroom-db.firebasestorage.app",
            messagingSenderId: "381597747239",
            appId: "1:381597747239:web:5db9d994dc0f8de9ec2602",
            measurementId: "G-5Q5WSL36YH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.currentImageIndexes = {};
        window.carsDataStore = {};

        async function loadUsedCars() {
            const grid = document.getElementById('cars-grid');
            const countBadge = document.getElementById('cars-count');
            
            try {
                const querySnapshot = await getDocs(collection(db, "cars"));
                const cars = [];
                
                querySnapshot.forEach((docSnap) => {
                    const car = docSnap.data();
                    car.firestoreId = docSnap.id;
                    // تصفية السيارات المستعملة فقط
                    if (car.type === 'used') {
                        cars.push(car);
                    }
                });

                countBadge.innerText = `${cars.length} سيارات متوفرة`;
                grid.innerHTML = '';

                if (cars.length === 0) {
                    grid.innerHTML = `<p class="col-span-full text-center text-slate-500 py-12">لا توجد عربيات مستعملة مضافة حالياً في السحابة.</p>`;
                    return;
                }

                cars.forEach(car => {
                    const carKey = car.firestoreId;
                    window.carsDataStore[carKey] = car;

                    if (window.currentImageIndexes[carKey] === undefined) {
                        window.currentImageIndexes[carKey] = 0;
                    }

                    // معالجة الصور
                    let imagesArray = [];
                    if (Array.isArray(car.images)) {
                        imagesArray = car.images;
                    } else if (car.image) {
                        imagesArray = [car.image];
                    } else {
                        imagesArray = ['https://via.placeholder.com/600x400'];
                    }

                    const imgIdx = window.currentImageIndexes[carKey];
                    const currentImg = imagesArray[imgIdx] || imagesArray[0];

                    grid.innerHTML += `
                        <div class="bg-cardBg rounded-2xl overflow-hidden border border-slate-800 shadow-xl flex flex-col justify-between group hover:border-amber-500/50 transition">
                            <!-- منطقة سلايدر الصور -->
                            <div class="relative h-56 bg-slate-900 overflow-hidden">
                                <img src="${currentImg}" alt="${car.name}" class="w-full h-full object-cover transition duration-300">
                                ${imagesArray.length > 1 ? `
                                    <button onclick="changeImage('${carKey}', -1)" class="absolute right-2 top-1/2 -translate-y-1/2 bg-black/60 hover:bg-black text-white w-9 h-9 rounded-full flex items-center justify-center transition backdrop-blur-sm shadow">
                                        <i class="fa-solid fa-chevron-right text-xs"></i>
                                    </button>
                                    <button onclick="changeImage('${carKey}', 1)" class="absolute left-2 top-1/2 -translate-y-1/2 bg-black/60 hover:bg-black text-white w-9 h-9 rounded-full flex items-center justify-center transition backdrop-blur-sm shadow">
                                        <i class="fa-solid fa-chevron-left text-xs"></i>
                                    </button>
                                    <span class="absolute bottom-2 left-2 bg-black/70 text-xs px-2.5 py-1 rounded-md text-amber-400 font-bold backdrop-blur-sm">
                                        ${imgIdx + 1} /${imagesArray.length}
                                    </span>
                                ` : ''}
                            </div>
                            <div class="p-6 flex-1 flex flex-col justify-between">
                                <div>
                                    <h3 class="text-xl font-bold mb-2 text-white">${car.name || 'سيارة مستعملة'}</h3>
                                    <p class="text-slate-400 text-sm mb-4 leading-relaxed">${car.description || car.desc || 'لا توجد تفاصيل إضافية.'}</p>
                                </div>
                                <div>
                                    <div class="text-amber-400 font-extrabold text-xl mb-4">${car.price || 'السعر عند الاتصال'}</div>
                                    <a href="https://wa.me/?text=${encodeURIComponent('أهلاً، أرغب في الاستفسار عن السيارة المستعملة: ' + (car.name || ''))}" target="_blank" class="block text-center bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition shadow-lg flex items-center justify-center gap-2">
                                        <i class="fa-brands fa-whatsapp text-lg"></i> استفسر عبر واتساب
                                    </a>
                                </div>
                            </div>
                        </div>
                    `;
                });

            } catch (error) {
                console.error("خطأ في جلب السيارات المستعملة: ", error);
                grid.innerHTML = `<p class="col-span-full text-center text-red-400 py-12">حدث خطأ أثناء الاتصال بقاعدة البيانات السحابية.</p>`;
            }
        }

        window.changeImage = function(carKey, direction) {
            const car = window.carsDataStore[carKey];
            if (!car) return;
            
            let imagesArray = [];
            if (Array.isArray(car.images)) imagesArray = car.images;
            else if (car.image) imagesArray = [car.image];
            else imagesArray = ['https://via.placeholder.com/600x400'];

            if (imagesArray.length > 1) {
                let current = window.currentImageIndexes[carKey] || 0;
                current += direction;
                if (current < 0) current = imagesArray.length - 1;
                if (current >= imagesArray.length) current = 0;
                window.currentImageIndexes[carKey] = current;
                loadUsedCars();
            }
        }

        loadUsedCars();
    </script>
</body>
</html>
